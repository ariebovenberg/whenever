version: 2

formats:
  - htmlzip

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
    # No Rust: the project's dashboard sets WHENEVER_NO_BUILD_RUST_EXT
    # (Admin > Environment variables), which this file cannot do

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
