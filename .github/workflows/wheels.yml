name: Build and publish wheels

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tag:
    name: Check tag correctness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A manual run builds and tests without a tag; only a tag releases
      - if: "startsWith(github.ref, 'refs/tags/')"
        run: |
          version=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')

          tag="${GITHUB_REF_NAME}"

          echo "Detected version in pyproject.toml: $version"
          echo "Detected tag name: $tag"

          # Compare them
          if [ "$version" != "$tag" ]; then
            echo "❌ Tag ($tag) does not match version in pyproject.toml ($version)"
            exit 1
          fi

          echo "✅ Tag matches version. Proceeding with release..."
  binary:
    needs: [check-tag]
    name: build on ${{ matrix.os }} (${{ matrix.target }}) (${{ matrix.manylinux || 'auto' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `native` marks the wheels their runner can execute without
          # emulation, so they are tested. checks.yml covers source builds
          # per OS and Python; the tests here cover what it cannot: missing
          # files, stripping, ABI tags, and the targets it never builds.
          # `pgo` marks the native targets worth profile-guided
          # optimization, which costs about 20% in extension size.

          # manylinux targets
          - os: linux
            target: x86_64
            native: true
            pgo: true
          - os: linux
            target: x86
          - os: linux
            target: aarch64
            runner: ubuntu-24.04-arm
            native: true
            pgo: true
          - os: linux
            target: armv7
          - os: linux
            target: ppc64le
          - os: linux
            target: s390x

          # musllinux targets
          - os: linux
            target: x86_64
            manylinux: musllinux_1_2
            native: true
            pgo: true
          - os: linux
            target: x86
            manylinux: musllinux_1_2
          - os: linux
            target: aarch64
            manylinux: musllinux_1_2
            runner: ubuntu-24.04-arm
            native: true
            pgo: true
          - os: linux
            target: armv7
            manylinux: musllinux_1_2

          # windows
          - os: windows
            target: x86_64
            native: true
            pgo: true
          - os: windows
            python-architecture: x86
            target: x86
            native: true

          # macos
          - os: macos
            target: x86_64
          - os: macos
            target: aarch64
            native: true
            pgo: true

    runs-on: ${{ matrix.runner || format('{0}-latest', (matrix.os == 'linux' && 'ubuntu') || matrix.os) }}
    timeout-minutes: 30
    env:
      # The interpreters the PGO profile is trained on. Python versions
      # compile parts of the extension differently, and a function trained
      # on another version gets no profile. 3.15 and 3.15t compile like
      # 3.14 and 3.14t. When adding a version, check the final build for
      # "hash mismatch" warnings.
      PGO_PYTHONS: 3.10 3.11 3.12 3.13 3.14 3.14t
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Generate third-party license information
        shell: bash
        run: |
          cargo install cargo-3pl --version 0.1.3 --locked
          # cargo 3pl reads every dependency in the manifest, and the wheel
          # contains only the normal and build ones
          python -c "import re, pathlib; p = pathlib.Path('Cargo.toml'); p.write_text(re.sub(r'\[dev-dependencies\][^\[]*|\[\[bench\]\][^\[]*', '', p.read_text()))"
          cargo 3pl > LICENSE-THIRD-PARTY
          git checkout -- Cargo.toml Cargo.lock
      - name: Sync Python environment
        run: uv sync --locked --group dev-extra --no-install-project
      # Profile-guided optimization: build instrumented wheels, run the
      # training workload against each, and build the release wheels with
      # the merged profile. The compiler picks each function's profile by
      # its shape, so one file serves every interpreter.
      - name: Build the instrumented wheels
        if: matrix.pgo
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out pgo-wheel --interpreter ${{ env.PGO_PYTHONS }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
        env:
          RUSTFLAGS: -Cprofile-generate=${{ github.workspace }}/pgo-profiles
      - name: Run the training workload
        if: matrix.pgo && !matrix.manylinux
        shell: bash
        run: |
          for version in $PGO_PYTHONS; do
            uv python install "$version"
            scripts/pgo_train.sh "$(uv python find --managed-python "$version")"
          done
      - name: Run the training workload (musllinux)
        if: matrix.pgo && matrix.manylinux
        # The same path inside the container, where the wheels write their
        # profiles. Alpine has no free-threaded image, so the free-threaded
        # musl wheels get a profile only where they compile like 3.14.
        run: |
          for version in $PGO_PYTHONS; do
            case $version in *t) continue ;; esac
            docker run --rm -v "$PWD:$PWD" -w "$PWD" "python:$version-alpine" \
              scripts/pgo_train.sh python
          done
      - name: Merge the profiles
        if: matrix.pgo
        shell: bash
        run: |
          rustup component add llvm-tools
          host=$(rustc -vV | sed -n 's/^host: //p')
          "$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-profdata" \
            merge -o pgo.profdata pgo-profiles
          echo "RUSTFLAGS=-Cprofile-use=${{ github.workspace }}/pgo.profdata" >> "$GITHUB_ENV"
      - name: build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist --interpreter '3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t'
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - run: uv run twine check --strict dist/*
      - name: Export the test requirements
        if: matrix.native
        run: uv export --locked --only-group test --no-hashes --no-emit-project -o test-requirements.txt
      # The oldest, the newest, and the free-threaded interpreter
      - name: Test the wheels
        if: matrix.native && !matrix.manylinux
        shell: bash
        run: |
          for version in 3.10 3.14 3.14t; do
            request="cpython-${version}${{ matrix.python-architecture == 'x86' && '-windows-x86' || '' }}"
            uv python install "$request"
            scripts/test_wheel.sh "$(uv python find --managed-python "$request")" wheel True test-requirements.txt
          done
      # musl wheels run in an Alpine container of the host architecture,
      # which has no free-threaded image
      - name: Test the wheels (musllinux)
        if: matrix.native && matrix.manylinux
        run: |
          for version in 3.10 3.14; do
            docker run --rm -v "$PWD:/io" -w /io "python:$version-alpine" \
              scripts/test_wheel.sh python wheel True test-requirements.txt
          done
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-binary-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'auto' }}
          path: dist/*

  pure-python:
    needs: [check-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked --all-groups --no-install-project
      - name: Build sdist and pure-Python wheel
        run: |
          uv build -C rust-extension=skip
      - run: uv run twine check --strict dist/*
      - name: Test the pure-Python wheel and the sdist
        run: |
          uv export --locked --only-group test --no-hashes --no-emit-project -o test-requirements.txt
          for version in 3.10 3.14 3.14t; do
            uv python install "$version"
            python="$(uv python find --managed-python "$version")"
            scripts/test_wheel.sh "$python" wheel False test-requirements.txt
            scripts/test_wheel.sh "$python" sdist False test-requirements.txt
          done
        env:
          WHENEVER_NO_BUILD_RUST_EXT: 1
      - name: Upload pure Python wheels and sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-pure-python
          path: dist/*

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [binary, pure-python]
    environment: Release
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Sanity check wheel count
        run: |
          COUNT=$(find wheels-* -maxdepth 1 -type f | wc -l)
          EXPECTED=114

          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "Expected exactly $EXPECTED wheels, found $COUNT"
            exit 1
          fi
      - name: Gather wheels
        run: |
          mkdir -p dist
          mv wheels-*/* dist
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
