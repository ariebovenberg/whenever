version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  versioning-strategy: increase-if-necessary
  ignore:
  # Downstream must stay free to pin whatever tzdata it likes.
  - dependency-name: tzdata
  commit-message:
    prefix: "🤖 "
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  commit-message:
    prefix: "🤖 "
